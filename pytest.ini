[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: 真实第三方 API 调用 (默认 skip, -m smoke 才跑)
    slow: 耗时测试 (测试内部用 JSR_RUN_SLOW_TESTS 环境变量放行)
    allow_network: 放行真实外网出口 (默认被 tests/conftest.py 掐断)
    allow_publish: 放行真实发布/上传实现 (默认被 tests/conftest.py 掐断)
    allow_browser: 放行真实 chromium 渲染 (默认被 tests/conftest.py 掐断)

# pytest-asyncio: 不显式配这一项每次跑都刷 PytestDeprecationWarning
asyncio_default_fixture_loop_scope = function
